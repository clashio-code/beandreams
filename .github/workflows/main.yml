          static int b_dl_iterate_phdr(int (*cb)(struct dl_phdr_info *, size_t, void *), void *data) {
            int i, r;
            for (i = 0; i < nmods; i++) {
              const Elf64_Ehdr *eh = (const Elf64_Ehdr *)mods[i].file;
              struct dl_phdr_info info;
              memset(&info, 0, sizeof info);
              info.dlpi_addr = (ElfW(Addr))mods[i].bias;
              info.dlpi_name = mods[i].name;
              info.dlpi_phdr = (const ElfW(Phdr) *)(mods[i].file + eh->e_phoff);
              info.dlpi_phnum = eh->e_phnum;
              info.dlpi_adds = (unsigned long long)nmods;
              r = cb(&info, sizeof info, data);
              if (r) return r;
            }
            return dl_iterate_phdr(cb, data);
          }

