            if (!m) { L("[JNI] Call*Method dengan methodID tak dikenal %p\n", mid); return; }
            if (m->fn) m->fn(a, r);
            else if (m->ncalls < 2) { char buf[400]; fmt_args(m, a, buf, sizeof buf); L("[java] (belum ada handler) %s%s (%s) -> 0\n", m->name, m->sig, buf); }
            m->ncalls++;
          }

