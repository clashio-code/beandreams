          static void *(*p_SDL_GameControllerOpen)(int);
          static const unsigned char *(*p_glGetString)(unsigned);
          static unsigned (*p_glGetError)(void);
          static void (*p_glReadPixels)(int, int, int, int, unsigned, unsigned, void *);
          static int g_dw, g_dh, g_ww, g_wh;

          static int gl_init(int want_w, int want_h) {
            static const char *libs[] = { "libSDL2-2.0.so.0", "/usr/lib/libSDL2-2.0.so.0", "libSDL2.so", NULL };
            static const int depths[2] = { 24, 16 };
            int i, t;
            for (i = 0; libs[i] && !sdl_h; i++) { sdl_h = dlopen(libs[i], RTLD_NOW | RTLD_GLOBAL); L("[sdl] dlopen %s : %s\n", libs[i], sdl_h ? "OK" : dlerror()); }
            if (!sdl_h) return -1;
          #define SYM(n) do { *(void **)&p_##n = dlsym(sdl_h, #n); if (!p_##n) { L("[sdl] simbol wajib %s tidak ada\n", #n); return -1; } } while (0)
          #define OPT(n) (*(void **)&p_##n = dlsym(sdl_h, #n))
            SYM(SDL_Init); SYM(SDL_InitSubSystem); SYM(SDL_GetError); SYM(SDL_GL_SetAttribute); SYM(SDL_CreateWindow); SYM(SDL_DestroyWindow); SYM(SDL_GL_CreateContext);
            SYM(SDL_GL_SwapWindow); SYM(SDL_GL_GetDrawableSize); SYM(SDL_GetWindowSize); SYM(SDL_GL_SetSwapInterval); SYM(SDL_PollEvent); SYM(SDL_GetTicks);
            OPT(SDL_GetCurrentVideoDriver); OPT(SDL_ShowCursor);
          #undef SYM
            if (p_SDL_Init(0x00000020u) != 0) { L("[sdl] SDL_Init(VIDEO) gagal: %s\n", p_SDL_GetError()); return -1; }
            L("[sdl] video driver: %s\n", p_SDL_GetCurrentVideoDriver && p_SDL_GetCurrentVideoDriver() ? p_SDL_GetCurrentVideoDriver() : "?");
            for (t = 0; t < 2 && !g_ctx; t++) {
              p_SDL_GL_SetAttribute(17, 2); p_SDL_GL_SetAttribute(18, 0); p_SDL_GL_SetAttribute(21, 4);   /* GLES 2.0 */
              p_SDL_GL_SetAttribute(0, 8); p_SDL_GL_SetAttribute(1, 8); p_SDL_GL_SetAttribute(2, 8); p_SDL_GL_SetAttribute(3, 0);
              p_SDL_GL_SetAttribute(5, 1); p_SDL_GL_SetAttribute(6, depths[t]); p_SDL_GL_SetAttribute(7, 8);
              g_win = p_SDL_CreateWindow("Bean Dreams", 0x1FFF0000, 0x1FFF0000, want_w, want_h, 0x00000002u | 0x00001001u);
              if (!g_win) { L("[sdl] SDL_CreateWindow (depth %d) gagal: %s\n", depths[t], p_SDL_GetError()); continue; }
              g_ctx = p_SDL_GL_CreateContext(g_win);
              if (!g_ctx) { L("[sdl] SDL_GL_CreateContext (GLES2, depth %d) gagal: %s\n", depths[t], p_SDL_GetError()); p_SDL_DestroyWindow(g_win); g_win = NULL; }
              else L("[sdl] konteks GLES2 dibuat (depth %d, stencil 8)\n", depths[t]);
            }
            if (!g_ctx) return -1;
            p_SDL_GL_SetSwapInterval(1);
            if (p_SDL_ShowCursor) p_SDL_ShowCursor(0);
            p_SDL_GL_GetDrawableSize(g_win, &g_dw, &g_dh);
            p_SDL_GetWindowSize(g_win, &g_ww, &g_wh);
            if (g_dw <= 0 || g_dh <= 0) { g_dw = want_w; g_dh = want_h; }
            if (g_ww <= 0 || g_wh <= 0) { g_ww = g_dw; g_wh = g_dh; }
            *(void **)&p_glGetString = h_gles ? dlsym(h_gles, "glGetString") : NULL;
            *(void **)&p_glGetError = h_gles ? dlsym(h_gles, "glGetError") : NULL;
            *(void **)&p_glReadPixels = h_gles ? dlsym(h_gles, "glReadPixels") : NULL;
            if (p_glGetString) {
              const char *ext = (const char *)p_glGetString(0x1F03);
              L("[gl] VENDOR   : %s\n", (const char *)p_glGetString(0x1F00));
              L("[gl] RENDERER : %s\n", (const char *)p_glGetString(0x1F01));
              L("[gl] VERSION  : %s\n", (const char *)p_glGetString(0x1F02));
              L("[gl] EXTENSIONS: %.1500s\n", ext ? ext : "(null)");
            }
            L("[gl] drawable %dx%d | jendela %dx%d\n", g_dw, g_dh, g_ww, g_wh);
            return 0;
          }

          static void pad_init(void) {
            int i, n;
            *(void **)&p_SDL_NumJoysticks = dlsym(sdl_h, "SDL_NumJoysticks"); *(void **)&p_SDL_JoystickOpen = dlsym(sdl_h, "SDL_JoystickOpen");
            *(void **)&p_SDL_JoystickName = dlsym(sdl_h, "SDL_JoystickName"); *(void **)&p_SDL_IsGameController = dlsym(sdl_h, "SDL_IsGameController");
            *(void **)&p_SDL_GameControllerOpen = dlsym(sdl_h, "SDL_GameControllerOpen");
            if (p_SDL_InitSubSystem(0x00000200u | 0x00002000u) != 0) { L("[pad] init joystick/controller gagal: %s\n", p_SDL_GetError()); return; }
            n = p_SDL_NumJoysticks ? p_SDL_NumJoysticks() : 0;
            L("[pad] joystick terdeteksi: %d\n", n);
            for (i = 0; i < n; i++) {
              void *j = p_SDL_JoystickOpen ? p_SDL_JoystickOpen(i) : NULL;
              int gc = p_SDL_IsGameController ? p_SDL_IsGameController(i) : 0;
              L("[pad] #%d nama=\"%s\" gamecontroller=%d\n", i, (j && p_SDL_JoystickName) ? p_SDL_JoystickName(j) : "?", gc);
              if (gc && p_SDL_GameControllerOpen) p_SDL_GameControllerOpen(i);
            }
          }

          /* ======================= audio: mixer SDL2 + WAV PCM16 =======================
           * Game memanggil loadSound(nama, path-m4a-di-APK) / playSound / playMusic ... (semula ditangani SoundPool & MediaPlayer di Java).
           * Decoder AAC tidak ada di device, jadi audio dikonversi SEKALI di PC oleh convert_audio.py ke audio/Samples/<id>.wav dan audio/Music/<id>.wav.
           * Efek: dimuat penuh ke RAM, di-resample ke 44.1 kHz, dimix sampai 32 suara (volume, pitch, loop gaya SoundPool: 0=sekali, -1=terus, N=ulang N kali).
           * Musik: satu track, dimuat penuh di thread terpisah (agar frame tidak tersendat), loop/jeda/volume. */
          #define AU_RATE 44100
          #define AU_MAXSND 160
          #define AU_MAXVOX 32
          static int g_audio = 1;                 /* --audio 0 = matikan semua suara */
          static int au_ok, au_tried;
          static uint32_t au_dev;
          static int (*p_SDL_OpenAudioDevice)(const char *, int, const void *, void *, int);
          static void (*p_SDL_PauseAudioDevice)(uint32_t, int);
          static void (*p_SDL_LockAudioDevice)(uint32_t);
          static void (*p_SDL_UnlockAudioDevice)(uint32_t);
          typedef struct { char name[96]; int16_t *pcm; long n; } AuSnd;
          typedef struct { int snd, active, loops; double pos, step; float vol; int64_t id; } AuVox;
          typedef struct { int16_t *pcm; long n; double pos; int loop, playing; } AuMus;
          static AuSnd au_snd[AU_MAXSND]; static int au_nsnd, au_nsnd_empty;
          static AuVox au_vox[AU_MAXVOX];
          static AuMus au_mus;
          static float au_mvol = 1.f;
          static int au_menabled = 1;
          static volatile int au_mgen;
          #define AU_LOCK() do { if (au_ok) p_SDL_LockAudioDevice(au_dev); } while (0)
          #define AU_UNLOCK() do { if (au_ok) p_SDL_UnlockAudioDevice(au_dev); } while (0)

          /* "…/Media/Music/123.m4a" -> "audio/Music/123.wav"; tanpa "/Media/" -> "audio/<nama-berkas>.wav" */
          static void au_wav_path(const char *apkpath, char *out, size_t n) {
            const char *rest = strstr(apkpath, "/Media/"), *dot;
            size_t l;
            if (rest) rest += 7; else { rest = strrchr(apkpath, '/'); rest = rest ? rest + 1 : apkpath; }
            snprintf(out, n, "audio/%s", rest);
            dot = strrchr(out, '.'); l = dot && strchr(dot, '/') == NULL ? (size_t)(dot - out) : strlen(out);
            if (l + 5 < n) { memcpy(out + l, ".wav", 5); }
          }
          static uint32_t rd32(const uint8_t *p) { return (uint32_t)p[0] | ((uint32_t)p[1] << 8) | ((uint32_t)p[2] << 16) | ((uint32_t)p[3] << 24); }
          static uint32_t rd16(const uint8_t *p) { return (uint32_t)p[0] | ((uint32_t)p[1] << 8); }
          /* hasil: stereo s16 pada AU_RATE (mono diduplikasi, rate lain di-resample linear); NULL bila berkas tak ada/format tidak didukung */
          static int16_t *au_load_wav(const char *path, long *frames_out) {
            FILE *f = fopen(path, "rb");
            uint8_t *b; long len, off = 12, dlen = 0, frames, i; const uint8_t *dp = NULL;
            uint32_t fmt = 0, ch = 0, rate = 0, bits = 0;
            int16_t *out, *raw;
            *frames_out = 0;
            if (!f) return NULL;
            fseek(f, 0, SEEK_END); len = ftell(f); fseek(f, 0, SEEK_SET);
            if (len < 44) { fclose(f); return NULL; }
            b = malloc((size_t)len);
            if (!b || fread(b, 1, (size_t)len, f) != (size_t)len) { free(b); fclose(f); return NULL; }
            fclose(f);
            if (memcmp(b, "RIFF", 4) || memcmp(b + 8, "WAVE", 4)) { free(b); return NULL; }
            while (off + 8 <= len) {
              uint32_t sz = rd32(b + off + 4);
              const uint8_t *body = b + off + 8;
              if (!memcmp(b + off, "fmt ", 4) && off + 8 + 16 <= len) { fmt = rd16(body); ch = rd16(body + 2); rate = rd32(body + 4); bits = rd16(body + 14); }
              else if (!memcmp(b + off, "data", 4)) { dp = body; dlen = (long)sz; if (off + 8 + dlen > len) dlen = len - off - 8; break; }
              off += 8 + (long)sz + (long)(sz & 1);
            }
            if (!dp || (fmt != 1 && fmt != 0xFFFE) || bits != 16 || (ch != 1 && ch != 2) || rate == 0) { free(b); return NULL; }
            frames = dlen / (long)(2 * ch);
            raw = malloc((size_t)(frames > 0 ? frames : 1) * 4);
            if (!raw) { free(b); return NULL; }
            for (i = 0; i < frames; i++) {
              int16_t l = (int16_t)rd16(dp + (size_t)i * 2 * ch), r = ch == 2 ? (int16_t)rd16(dp + (size_t)i * 4 + 2) : l;
              raw[i * 2] = l; raw[i * 2 + 1] = r;
            }
            free(b);
            if (rate == AU_RATE || frames == 0) { *frames_out = frames; return raw; }
            { long outn = (long)((double)frames * AU_RATE / (double)rate), k;
              out = malloc((size_t)(outn > 0 ? outn : 1) * 4);
              if (!out) { free(raw); return NULL; }
              for (k = 0; k < outn; k++) {
                double sp = (double)k * (double)rate / AU_RATE, fr; long i0 = (long)sp, i1; int c;
                if (i0 >= frames) i0 = frames - 1;
                i1 = i0 + 1 < frames ? i0 + 1 : i0; fr = sp - (double)i0;
                for (c = 0; c < 2; c++) out[k * 2 + c] = (int16_t)(raw[i0 * 2 + c] + (raw[i1 * 2 + c] - raw[i0 * 2 + c]) * fr);
              }
              free(raw); *frames_out = outn; return out; }
          }

          static void au_callback(void *ud, uint8_t *stream, int len) {
            int16_t *o = (int16_t *)stream;
            int frames = len / 4, i, v;
            (void)ud;
            for (i = 0; i < frames; i++) {
              float l = 0.f, r = 0.f;
              for (v = 0; v < AU_MAXVOX; v++) {
                AuVox *x = &au_vox[v];
                const AuSnd *s;
                long i0, i1; float fr;
                if (!x->active) continue;
                s = &au_snd[x->snd];
                if (!s->pcm || x->pos >= (double)s->n) {
                  if (s->pcm && x->loops != 0 && s->n > 0) { if (x->loops > 0) x->loops--; x->pos -= (double)s->n; if (x->pos < 0) x->pos = 0; }
                  else { x->active = 0; continue; }
                }
                i0 = (long)x->pos; fr = (float)(x->pos - (double)i0); i1 = i0 + 1 < s->n ? i0 + 1 : i0;
                l += ((float)s->pcm[i0 * 2] + ((float)s->pcm[i1 * 2] - (float)s->pcm[i0 * 2]) * fr) * x->vol;
                r += ((float)s->pcm[i0 * 2 + 1] + ((float)s->pcm[i1 * 2 + 1] - (float)s->pcm[i0 * 2 + 1]) * fr) * x->vol;
                x->pos += x->step;
              }
              if (au_mus.pcm && au_mus.playing && au_menabled) {
                long p = (long)au_mus.pos;
                if (p >= au_mus.n) { if (au_mus.loop && au_mus.n > 0) { au_mus.pos = 0; p = 0; } else { au_mus.playing = 0; p = -1; } }
                if (p >= 0) { l += (float)au_mus.pcm[p * 2] * au_mvol; r += (float)au_mus.pcm[p * 2 + 1] * au_mvol; au_mus.pos += 1.0; }
              }
              if (l > 32767.f) l = 32767.f;
              if (l < -32768.f) l = -32768.f;
              if (r > 32767.f) r = 32767.f;
              if (r < -32768.f) r = -32768.f;
              o[i * 2] = (int16_t)l; o[i * 2 + 1] = (int16_t)r;
            }
          }

          static int au_init(void) {
            struct { int freq; uint16_t format; uint8_t channels, silence; uint16_t samples, padding; uint32_t size; void (*callback)(void *, uint8_t *, int); void *userdata; } want, have;
            int (*initsub)(uint32_t);
            void *h;
            if (au_tried) return au_ok;
            au_tried = 1;
            if (!g_audio) { L("[audio] dimatikan (--audio 0)\n"); return 0; }
            h = sdl_h ? sdl_h : dlopen("libSDL2-2.0.so.0", RTLD_NOW | RTLD_GLOBAL);
            if (!h) { L("[audio] SDL2 tidak bisa dibuka -> tanpa suara\n"); return 0; }
            *(void **)&initsub = dlsym(h, "SDL_InitSubSystem");
            *(void **)&p_SDL_OpenAudioDevice = dlsym(h, "SDL_OpenAudioDevice");
            *(void **)&p_SDL_PauseAudioDevice = dlsym(h, "SDL_PauseAudioDevice");
            *(void **)&p_SDL_LockAudioDevice = dlsym(h, "SDL_LockAudioDevice");
            *(void **)&p_SDL_UnlockAudioDevice = dlsym(h, "SDL_UnlockAudioDevice");
            if (!initsub || !p_SDL_OpenAudioDevice || !p_SDL_PauseAudioDevice || !p_SDL_LockAudioDevice || !p_SDL_UnlockAudioDevice) { L("[audio] simbol SDL audio kurang -> tanpa suara\n"); return 0; }
            if (initsub(0x10u) != 0) { L("[audio] SDL_InitSubSystem(AUDIO) gagal -> tanpa suara\n"); return 0; }
            memset(&want, 0, sizeof want); memset(&have, 0, sizeof have);
            want.freq = AU_RATE; want.format = 0x8010; want.channels = 2; want.samples = 1024; want.callback = au_callback;
            au_dev = (uint32_t)p_SDL_OpenAudioDevice(NULL, 0, &want, &have, 0);
            if (au_dev == 0) { L("[audio] SDL_OpenAudioDevice gagal -> tanpa suara\n"); return 0; }
            L("[audio] perangkat audio OK: minta %d Hz s16 stereo, dapat %d Hz fmt=0x%x ch=%d samples=%d\n", want.freq, have.freq, have.format, have.channels, have.samples);
            p_SDL_PauseAudioDevice(au_dev, 0);
            au_ok = 1;
            return 1;
          }

          static AuSnd *au_find(const char *name) { int i; for (i = 0; i < au_nsnd; i++) if (!strcmp(au_snd[i].name, name)) return &au_snd[i]; return NULL; }
          static void au_load_sound(const char *name, const char *apkpath) {
            char wav[760];
            AuSnd *s;
            int16_t *pcm; long n = 0;
            if (!g_audio) return;
            if (!au_init()) return;
            if (au_find(name) || au_nsnd >= AU_MAXSND) return;
            au_wav_path(apkpath, wav, sizeof wav);
            pcm = au_load_wav(wav, &n);
            s = &au_snd[au_nsnd];
            snprintf(s->name, sizeof s->name, "%s", name);
            AU_LOCK(); s->pcm = pcm; s->n = n; au_nsnd++; AU_UNLOCK();
            if (!pcm) { if (au_nsnd_empty++ < 5) L("[audio] WAV tidak ada/tidak valid: %s (jalankan convert_audio.py)\n", wav); }
          }
          static void au_unload_sound(const char *name) {
            AuSnd *s = au_find(name);
            int v;
            int16_t *old;
            if (!s || !au_ok) return;
            AU_LOCK();
            for (v = 0; v < AU_MAXVOX; v++) if (au_vox[v].active && &au_snd[au_vox[v].snd] == s) au_vox[v].active = 0;
            old = s->pcm; s->pcm = NULL; s->n = 0;
            AU_UNLOCK();
            free(old);
          }
          static void au_play_sound(int64_t id, const char *name, float vol, float pitch, int loop) {
            AuSnd *s = au_find(name);
            int v, pick = 0;
            if (!au_ok || !s || !s->pcm) return;
            AU_LOCK();
            for (v = 0; v < AU_MAXVOX; v++) { if (!au_vox[v].active) { pick = v; break; } if (au_vox[v].id < au_vox[pick].id) pick = v; }
            au_vox[pick].snd = (int)(s - au_snd); au_vox[pick].pos = 0; au_vox[pick].loops = loop; au_vox[pick].vol = vol; au_vox[pick].step = pitch > 0.f ? (double)pitch : 1.0;
            au_vox[pick].id = id; au_vox[pick].active = 1;
            AU_UNLOCK();
          }
          static AuVox *au_vox_by_id(int64_t id) { int v; for (v = 0; v < AU_MAXVOX; v++) if (au_vox[v].active && au_vox[v].id == id) return &au_vox[v]; return NULL; }
          static void au_stop_sound(int64_t id) { AuVox *x; if (!au_ok) return; AU_LOCK(); x = au_vox_by_id(id); if (x) x->active = 0; AU_UNLOCK(); }
          static void au_set_sound_vol(int64_t id, float v) { AuVox *x; if (!au_ok) return; AU_LOCK(); x = au_vox_by_id(id); if (x) x->vol = v; AU_UNLOCK(); }
          static void au_set_sound_pitch(int64_t id, float p) { AuVox *x; if (!au_ok) return; AU_LOCK(); x = au_vox_by_id(id); if (x && p > 0.f) x->step = (double)p; AU_UNLOCK(); }

          typedef struct { char path[760]; int loop, gen; } MusReq;
          static void *mus_thread(void *p) {
            MusReq *rq = p;
            char wav[760];
            long n = 0;
            int16_t *pcm, *old;
            au_wav_path(rq->path, wav, sizeof wav);
            pcm = au_load_wav(wav, &n);
            if (!pcm) { L("[audio] musik: WAV tidak ada/tidak valid: %s (jalankan convert_audio.py)\n", wav); free(rq); return NULL; }
            AU_LOCK();
            if (rq->gen != au_mgen) { AU_UNLOCK(); free(pcm); free(rq); return NULL; }   /* dibatalkan (stopMusic/playMusic baru) selama memuat */
            old = au_mus.pcm; au_mus.pcm = pcm; au_mus.n = n; au_mus.pos = 0; au_mus.loop = rq->loop; au_mus.playing = 1;
            AU_UNLOCK();
            free(old);
            L("[audio] musik dimuat: %s (%ld frame, %.1f dtk, loop=%d)\n", wav, n, (double)n / AU_RATE, rq->loop);
            free(rq);
            return NULL;
          }
          static void au_play_music(const char *path, int enabled, int loopcount) {
            MusReq *rq;
            pthread_t th;
            if (!g_audio || !au_init()) return;
            AU_LOCK(); au_menabled = enabled != 0; au_mus.playing = 0; au_mgen++; AU_UNLOCK();
            rq = calloc(1, sizeof *rq);
            if (!rq) return;
            snprintf(rq->path, sizeof rq->path, "%s", path); rq->loop = loopcount != 0; rq->gen = au_mgen;
            if (pthread_create(&th, NULL, mus_thread, rq) == 0) pthread_detach(th); else free(rq);
          }
          static void au_stop_music(void) { int16_t *old; if (!au_ok) return; AU_LOCK(); au_mgen++; au_mus.playing = 0; old = au_mus.pcm; au_mus.pcm = NULL; au_mus.n = 0; AU_UNLOCK(); free(old); }
          static void au_set_music_vol(float v) { au_mvol = v < 0 ? -v : v; }
          static void au_set_music_enabled(int e) { au_menabled = e != 0; }
          static void au_play_voice(const char *path) {
            static int64_t vid = 1000000;
            char nm[100];
            if (!g_audio || !au_init()) return;
            snprintf(nm, sizeof nm, "voice:%.80s", path);
            au_load_sound(nm, path);
            au_play_sound(++vid, nm, 1.f, 1.f, 0);
          }
          static void au_report(void) {
            int i, ok = 0;
            for (i = 0; i < au_nsnd; i++) if (au_snd[i].pcm) ok++;
            L("[audio] ringkasan: %d efek terdaftar, %d berhasil dimuat, %d tanpa WAV | perangkat %s\n", au_nsnd, ok, au_nsnd - ok, au_ok ? "aktif" : "TIDAK aktif");
          }

          /* ======================= titik masuk native (static JNI: env, kelas, responder, ...) ======================= */
          typedef void (*nf_init_t)(void *, void *, void *, void *, void *, int, int, void *, void *, int);
          typedef void (*nf_r_t)(void *, void *, void *);
          typedef void (*nf_ii_t)(void *, void *, void *, int, int);
          typedef void (*nf_render_t)(void *, void *, void *, float, int);
          typedef void (*nf_ptr_t)(void *, void *, void *, int, float, float, float);
          typedef void (*nf_dl_t)(void *, void *, void *, int64_t);
          static nf_init_t nf_Init; static nf_r_t nf_Activate, nf_Deactivate; static nf_ii_t nf_Resized, nf_KeyDownUp; static nf_render_t nf_Render;
          static nf_ptr_t nf_PtrDown, nf_PtrMove, nf_PtrUp; static nf_dl_t nf_DlFail;
          static int bind_natives(Mod *m) {
            static const struct { const char *n; void **p; } t[] = {
              {"NativeInit", (void **)&nf_Init}, {"NativeActivate", (void **)&nf_Activate}, {"NativeDeactivate", (void **)&nf_Deactivate},
              {"NativeResized", (void **)&nf_Resized}, {"NativeKeyDownUp", (void **)&nf_KeyDownUp}, {"NativeRender", (void **)&nf_Render},
              {"NativePointerDown", (void **)&nf_PtrDown}, {"NativePointerMove", (void **)&nf_PtrMove}, {"NativePointerUp", (void **)&nf_PtrUp},
              {"NativeDownloadFailure", (void **)&nf_DlFail}, {NULL, NULL} };
            char full[160];
            int i, bad = 0;
            for (i = 0; t[i].n; i++) {
              snprintf(full, sizeof full, "Java_com_kumobius_android_NativeInterface_%s", t[i].n);
              *t[i].p = mod_find(m, full);
              if (!*t[i].p) { L("[bind] %s tidak ditemukan\n", t[i].n); bad++; }
            }
            return bad;
          }
          #define ENV (&g_envobj)

          /* ---- input: tombol SDL -> keycode Android mentah (yang diteruskan Java ke NativeKeyDownUp) ---- */
          static int g_keylog;
          static void send_key(int code, int down) {
            if (g_keylog++ < 80) L("[input] key %d %s\n", code, down ? "down" : "up");
            g_phase = "NativeKeyDownUp";
            nf_KeyDownUp(ENV, g_ni_cls, g_resp, code, down);
            local_reset();
          }
          static const int pad_map[15] = {
            96 /*A*/, 97 /*B*/, 99 /*X*/, 100 /*Y*/, 4 /*BACK(select)->KEYCODE_BACK*/, 0 /*GUIDE*/, 108 /*START*/, 106 /*L3*/, 107 /*R3*/,
            102 /*L1*/, 103 /*R1*/, 19 /*up*/, 20 /*down*/, 21 /*left*/, 22 /*right*/ };
          static int g_sel, g_start, g_stk[4];   /* stik kiri -> D-pad digital: kiri,kanan,atas,bawah */
          static void stick_update(int idx, int on, int code) { if (g_stk[idx] != on) { g_stk[idx] = on; send_key(code, on); } }
          static float to_px(float x) { return g_ww > 0 ? x * (float)g_dw / (float)g_ww : x; }
          static float to_py(float y) { return g_wh > 0 ? y * (float)g_dh / (float)g_wh : y; }
          static int g_ptr_down;
          static int g_shot_req;   /* START+L1 = minta tangkapan layar pada frame berikutnya */
          static float now_s(void) { return (float)p_SDL_GetTicks() * 0.001f; }
          static void pump_events(void) {
            unsigned char ev[64] __attribute__((aligned(8)));
            while (p_SDL_PollEvent(ev)) {
              uint32_t t = *(uint32_t *)ev;
              if (t == 0x100) g_quit = 1;                                                       /* SDL_QUIT */
              else if (t == 0x653 && p_SDL_GameControllerOpen) p_SDL_GameControllerOpen(*(int32_t *)(ev + 8));   /* CONTROLLERDEVICEADDED */
              else if (t == 0x651 || t == 0x652) {                                              /* CONTROLLERBUTTONDOWN / UP */
                int down = (t == 0x651), b = ev[12];
                if (b == 4) g_sel = down;
                if (b == 6) g_start = down;
                if (g_sel && g_start) { L("[input] SELECT+START -> keluar\n"); g_quit = 1; }
                if (b == 9 && down && g_start) { g_shot_req = 1; L("[input] START+L1 -> tangkapan layar\n"); continue; }
                if (b >= 0 && b < 15 && pad_map[b]) send_key(pad_map[b], down); else L("[input] tombol %d tidak dipetakan\n", b);
              } else if (t == 0x650) {                                                          /* CONTROLLERAXISMOTION */
                float v = (float)(*(int16_t *)(ev + 16)) / 32768.f;
                if (ev[12] == 0) { stick_update(0, v < -0.5f, 21); stick_update(1, v > 0.5f, 22); }
                else if (ev[12] == 1) { stick_update(2, v < -0.5f, 19); stick_update(3, v > 0.5f, 20); }
              } else if (t == 0x401) { g_ptr_down = 1; g_phase = "NativePointerDown"; nf_PtrDown(ENV, g_ni_cls, g_resp, 0, to_px((float)*(int32_t *)(ev + 20)), to_py((float)*(int32_t *)(ev + 24)), now_s()); local_reset(); }
              else if (t == 0x402) { g_ptr_down = 0; g_phase = "NativePointerUp"; nf_PtrUp(ENV, g_ni_cls, g_resp, 0, to_px((float)*(int32_t *)(ev + 20)), to_py((float)*(int32_t *)(ev + 24)), now_s()); local_reset(); }
              else if (t == 0x400 && g_ptr_down) { g_phase = "NativePointerMove"; nf_PtrMove(ENV, g_ni_cls, g_resp, 0, to_px((float)*(int32_t *)(ev + 20)), to_py((float)*(int32_t *)(ev + 24)), now_s()); local_reset(); }
              else if (t == 0x700 || t == 0x701 || t == 0x702) {                               /* FINGERDOWN / UP / MOTION */
                float x = *(float *)(ev + 24) * (float)g_dw, y = *(float *)(ev + 28) * (float)g_dh;
                int id = (int)(*(int64_t *)(ev + 16) & 0xff);
                g_phase = "NativePointer(finger)";
                (t == 0x700 ? nf_PtrDown : t == 0x701 ? nf_PtrUp : nf_PtrMove)(ENV, g_ni_cls, g_resp, id, x, y, now_s());
                local_reset();
              }
            }
          }

          /* ---- tangkapan layar (BMP 24-bit) + statistik piksel, supaya hasil render bisa dibuktikan tanpa melihat layar ---- */
          static int write_bmp(const char *path, const uint8_t *rgba, int w, int h) {
            FILE *f = fopen(path, "wb");
            uint32_t rowb = ((uint32_t)w * 3u + 3u) & ~3u, size = 54u + rowb * (uint32_t)h;
            uint8_t hdr[54] = { 'B', 'M' };
            int x, y;
            uint8_t *row;
            if (!f) return -1;
            hdr[2] = (uint8_t)size; hdr[3] = (uint8_t)(size >> 8); hdr[4] = (uint8_t)(size >> 16); hdr[5] = (uint8_t)(size >> 24);
            hdr[10] = 54; hdr[14] = 40;
            hdr[18] = (uint8_t)w; hdr[19] = (uint8_t)(w >> 8); hdr[20] = (uint8_t)(w >> 16); hdr[22] = (uint8_t)h; hdr[23] = (uint8_t)(h >> 8); hdr[24] = (uint8_t)(h >> 16);
            hdr[26] = 1; hdr[28] = 24;
            fwrite(hdr, 1, 54, f);
            row = calloc(1, rowb);
            if (!row) { fclose(f); return -1; }
            for (y = 0; y < h; y++) {                       /* glReadPixels: baris 0 = bawah, sama dengan urutan BMP */
              for (x = 0; x < w; x++) { const uint8_t *p = rgba + ((size_t)y * (size_t)w + (size_t)x) * 4; row[x * 3] = p[2]; row[x * 3 + 1] = p[1]; row[x * 3 + 2] = p[0]; }
              fwrite(row, 1, rowb, f);
            }
            free(row); fclose(f);
            return 0;
          }
          static void pixel_stats(const uint8_t *rgba, int w, int h, int *nonblack_pct, int *r, int *g, int *b) {
            size_t n = (size_t)w * (size_t)h, i, nb = 0; uint64_t sr = 0, sg = 0, sb = 0;
            for (i = 0; i < n; i++) { const uint8_t *p = rgba + i * 4; sr += p[0]; sg += p[1]; sb += p[2]; if (p[0] | p[1] | p[2]) nb++; }
            *nonblack_pct = n ? (int)(nb * 100 / n) : 0;
            *r = n ? (int)(sr / n) : 0; *g = n ? (int)(sg / n) : 0; *b = n ? (int)(sb / n) : 0;
          }
          static void take_shot(int frame) {
            uint8_t *px;
            int nb, r, g, b;
            char path[64];
            if (!p_glReadPixels) return;
            px = malloc((size_t)g_dw * (size_t)g_dh * 4);
            if (!px) return;
            p_glReadPixels(0, 0, g_dw, g_dh, 0x1908, 0x1401, px);
            pixel_stats(px, g_dw, g_dh, &nb, &r, &g, &b);
            snprintf(path, sizeof path, "shot_%d.bmp", frame);
            L("[shot] frame %d: piksel tidak-hitam=%d%% rata-rata RGB=(%d,%d,%d) -> %s (%s)\n", frame, nb, r, g, b, path, write_bmp(path, px, g_dw, g_dh) == 0 ? "tersimpan" : "GAGAL");
            free(px);
          }

          static int find_apk(char *out, size_t n) {
            DIR *d = opendir(".");
            struct dirent *e;
            if (!d) return -1;
            while ((e = readdir(d)) != NULL) {
              size_t l = strlen(e->d_name);
              if (l > 4 && !strcmp(e->d_name + l - 4, ".apk")) { snprintf(out, n, "%s", e->d_name); closedir(d); return 0; }
            }
            closedir(d);
            return -1;
          }

          typedef struct { int frames, w, h, lofi; const char *locale, *overrides, *apk, *shots; int maxtime; } RunCfg;
          static int shot_wanted(const char *list, int frame) {
            const char *p = list;
            while (p && *p) {
              int v = 0;
              while (*p >= '0' && *p <= '9') v = v * 10 + (*p++ - '0');
              if (v == frame) return 1;
              while (*p && (*p < '0' || *p > '9')) p++;
            }
            return 0;
          }
          static int run_game(Mod *kg, const RunCfg *c, int timeout) {
            char cwd[480], apk[300], bundle[900], userdir[520];
            int frame = 0, i;
            long long t0, tl;
            if (bind_natives(kg) != 0) return 1;
            if (!getcwd(cwd, sizeof cwd)) { L("getcwd gagal\n"); return 1; }
            if (c->apk && c->apk[0]) snprintf(apk, sizeof apk, "%s", c->apk);
            else if (find_apk(apk, sizeof apk) != 0) { L("Tidak ada file *.apk di %s (dibutuhkan; engine membaca aset langsung dari APK)\n", cwd); return 1; }
            snprintf(bundle, sizeof bundle, "%s/%s/assets", cwd, apk);
            snprintf(userdir, sizeof userdir, "%s/save", cwd);
            mkdir(userdir, 0755);
            { struct stat st; char p[1000]; snprintf(p, sizeof p, "%s/%s", cwd, apk); if (stat(p, &st) != 0) { L("APK tidak ketemu: %s\n", p); return 1; } L("[game] APK: %s (%lld byte)\n", p, (long long)st.st_size); }
            L("[game] bundle path : %s\n[game] user data dir: %s\n[game] locale=%s overrides=\"%s\" lofi=%d\n", bundle, userdir, c->locale, c->overrides, c->lofi);

            if (gl_init(c->w, c->h) != 0) return 1;
            pad_init();

            g_resp = mk_obj("com/kumobius/android/KumoAppActivity"); ((H *)g_resp)->global = 1;
            g_ni_cls = mk_cls("com/kumobius/android/NativeInterface");

            L("\n== NativeInit(%dx%d) ==\n", g_dw, g_dh);
            g_phase = "NativeInit"; alarm((unsigned)(timeout > 0 ? timeout : 60)); t0 = now_ns();
            nf_Init(ENV, g_ni_cls, g_resp, mk_str(bundle), mk_str(userdir), g_dw, g_dh, mk_str(c->locale), mk_str(c->overrides), c->lofi);
            local_reset();
            L("== NativeInit selesai (%.0f ms) ==\n", (double)(now_ns() - t0) / 1e6);
            au_report();
            g_phase = "NativeResized"; nf_Resized(ENV, g_ni_cls, g_resp, g_dw, g_dh); local_reset();
            g_phase = "NativeActivate"; nf_Activate(ENV, g_ni_cls, g_resp); local_reset();
            if (p_glGetError) L("[gl] glGetError setelah init: 0x%x\n", p_glGetError());

            L("\n== loop render (%s) ==\n", c->frames < 0 ? "tanpa batas; SELECT+START untuk keluar" : "terbatas");
            tl = now_ns();
            { long long tstart = tl;
            while (!g_quit && (c->frames < 0 || frame < c->frames)) {
              g_frame = frame;
              if (c->maxtime > 0 && now_ns() - tstart > (long long)c->maxtime * 1000000000LL) { L("[game] --maxtime %d dtk tercapai -> keluar\n", c->maxtime); break; }
              pump_events();
              g_phase = "NativeRender"; alarm((unsigned)(timeout > 0 ? timeout : 60));
              nf_Render(ENV, g_ni_cls, g_resp, 60.0f, 1);
              local_reset();
              for (i = 0; i < g_dl_n; i++) { g_phase = "NativeDownloadFailure"; nf_DlFail(ENV, g_ni_cls, g_resp, g_dl_q[i]); local_reset(); }
              g_dl_n = 0;
              if (frame < 5 && p_glGetError) { unsigned e = p_glGetError(); if (e) L("[gl] frame %d: glGetError = 0x%x\n", frame, e); }
              if (shot_wanted(c->shots, frame) || g_shot_req) { take_shot(frame); g_shot_req = 0; }
              p_SDL_GL_SwapWindow(g_win);
              frame++;
              if (frame % 120 == 0) { long long t = now_ns(); L("[fps] frame %d: %.1f fps\n", frame, 120.0 * 1e9 / (double)(t - tl)); tl = t; }
            }
            }
            alarm(0);
            L("\n== loop selesai di frame %d (%s) ==\n", frame, g_quit ? "keluar diminta" : "batas frame tercapai");
            g_phase = "NativeDeactivate"; alarm(10); nf_Deactivate(ENV, g_ni_cls, g_resp); local_reset(); alarm(0);
            return 0;
          }

          /* ======================= uji mandiri (jalan di x86 maupun aarch64) ======================= */
          typedef void *(*t_objm)(void *, void *, void *, ...);
          typedef int64_t (*t_longm)(void *, void *, void *, ...);
          typedef int32_t (*t_intm)(void *, void *, void *, ...);
          typedef uint8_t (*t_boolm)(void *, void *, void *, ...);
