          #!/bin/bash
          # Probe Bean Dreams (Milestone 1, arm64). Hanya membaca, tidak mengubah apa pun.
          # Folder data dicari seperti launcher PortMaster lain: /$directory/ports/<nama>

          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}

          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi

          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"

          GAMEDIR="/$directory/ports/bean_dreams"
          [ -d "$GAMEDIR" ] || GAMEDIR="$(cd "$(dirname "$0")" && pwd)/bean_dreams"

          cd "$GAMEDIR" || {
            echo "folder bean_dreams tidak ketemu. Dicari di: /$directory/ports/bean_dreams dan di sebelah script ini." > "$(dirname "$0")/probe_error.txt"
            exit 1
          }

          chmod +x ./elfprobe64 2>/dev/null

          echo "GAMEDIR=$GAMEDIR" > probe_stdout.txt
          uname -a >> probe_stdout.txt 2>&1
          # engine membaca aset langsung dari APK (bundle path = <apk>/assets), jadi namanya harus berakhiran .apk
          APKS="$(ls ./*.apk 2>/dev/null)"
          if [ -n "$APKS" ]; then echo "APK ditemukan: $APKS" >> probe_stdout.txt; else echo "PERINGATAN: tidak ada *.apk di $GAMEDIR (dibutuhkan mulai loader stage 3)" >> probe_stdout.txt; fi
          if [ ! -f libs/libKumoGame.so ]; then
            echo "libs/libKumoGame.so belum ada di $GAMEDIR/libs" > probe_report.txt
            cat probe_report.txt >> probe_stdout.txt
            sleep 3
            exit 1
          fi

          ./elfprobe64 libs/libKumoGame.so probe_report.txt >> probe_stdout.txt 2>&1
          echo "exit code: $?" >> probe_stdout.txt
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_SH1
          cat > out/BeanLoader.sh <<'EOF_SH2'
          #!/bin/bash
          # Loader Bean Dreams (Milestone 4, arm64). Argumen dibaca dari loader.args, mis: --stage 3 --timeout 90 --maxtime 300
          # stage 0 = muat+relokasi | 1 = +konstruktor | 2 = +jendela/GLES2/NativeInit/N frame render | 3 = main tanpa batas (SELECT+START keluar)
          # Folder data dicari seperti launcher PortMaster lain: /$directory/ports/<nama>

          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}

          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi

          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"

          GAMEDIR="/$directory/ports/bean_dreams"
          [ -d "$GAMEDIR" ] || GAMEDIR="$(cd "$(dirname "$0")" && pwd)/bean_dreams"

          cd "$GAMEDIR" || {
            echo "folder bean_dreams tidak ketemu. Dicari di: /$directory/ports/bean_dreams dan di sebelah script ini." > "$(dirname "$0")/loader_error.txt"
            exit 1
          }

          chmod +x ./beanloader 2>/dev/null

          if [ ! -f libs/libKumoGame.so ] || [ ! -f ./beanloader ]; then
            echo "libs/libKumoGame.so atau beanloader belum ada di $GAMEDIR" > loader_stdout.txt
            sleep 3
            exit 1
          fi

          export SDL_GAMECONTROLLERCONFIG="$sdl_controllerconfig"
          # hapus log dan tangkapan layar lama supaya tidak tertukar dengan hasil run ini
          rm -f loader_log.txt shot_*.bmp
          LOADER_ARGS="$(cat loader.args 2>/dev/null)"
          echo "GAMEDIR=$GAMEDIR  args=$LOADER_ARGS" > loader_stdout.txt
          ./beanloader libs $LOADER_ARGS >> loader_stdout.txt 2>&1
          echo "exit code: $?" >> loader_stdout.txt
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_SH2
          cat > out/bean_dreams/convert_audio.py <<'EOF_PY1'
          #!/usr/bin/env python3
          """Konversi audio Bean Dreams (m4a/AAC di dalam APK) -> WAV PCM16 stereo 44.1 kHz untuk beanloader.

          Pakai:
              python3 convert_audio.py bean-dreams-4-8.apk [folder_keluaran] [--rate 44100] [--ffmpeg ffmpeg]

          Butuh ffmpeg di PATH (https://ffmpeg.org). Jalankan di PC (bukan di handheld), lalu salin folder hasilnya
          ('audio') ke folder game di handheld, di samping beanloader:
              bean_dreams/audio/Samples/*.wav
              bean_dreams/audio/Music/*.wav
          Hanya untuk pemakaian pribadi dari APK milik sendiri; jangan didistribusikan ulang."""
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          import zipfile

          EXTS = (".m4a", ".mp3", ".ogg", ".aac", ".wav", ".mp4")
          PREFIX = "assets/Media/"


          def main(argv):
              args = [a for a in argv[1:] if not a.startswith("--")]
              opts = {}
              it = iter(argv[1:])
              for a in it:
                  if a in ("--rate", "--ffmpeg"):
                      opts[a] = next(it, "")
              if not args:
                  print(__doc__)
                  return 2
              apk = args[0]
              out_root = args[1] if len(args) > 1 else "audio"
              rate = opts.get("--rate", "44100")
              ffmpeg = opts.get("--ffmpeg", "ffmpeg")
              if shutil.which(ffmpeg) is None:
                  print("ffmpeg tidak ditemukan. Pasang ffmpeg dan pastikan ada di PATH (atau pakai --ffmpeg /path/ke/ffmpeg).")
                  return 1
              zf = zipfile.ZipFile(apk)
              items = [n for n in zf.namelist() if n.startswith(PREFIX) and n.lower().endswith(EXTS) and not n.endswith("/")]
              # video (Intro.mp4 dsb.) tidak diperlukan: loader melewati video
              items = [n for n in items if not n.lower().endswith(".mp4") and "/Video/" not in n]
              if not items:
                  print("Tidak ada berkas audio di", PREFIX, "dalam", apk)
                  return 1
              ok = fail = 0
              total = 0
              tmp = tempfile.mkdtemp(prefix="beanaudio_")
              try:
                  for i, name in enumerate(sorted(items), 1):
                      rest = name[len(PREFIX):]
                      dst = os.path.join(out_root, os.path.splitext(rest)[0] + ".wav")
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      src = os.path.join(tmp, os.path.basename(name))
                      with open(src, "wb") as f:
                          f.write(zf.read(name))
                      cmd = [ffmpeg, "-y", "-loglevel", "error", "-i", src, "-vn", "-ac", "2", "-ar", rate, "-c:a", "pcm_s16le", dst]
                      r = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                      os.remove(src)
                      if r.returncode == 0 and os.path.exists(dst):
                          ok += 1
                          total += os.path.getsize(dst)
                          print("[%d/%d] %s -> %s" % (i, len(items), rest, dst))
                      else:
                          fail += 1
                          print("[%d/%d] GAGAL %s: %s" % (i, len(items), rest, r.stderr.decode("utf8", "replace").strip()[:200]))
              finally:
                  shutil.rmtree(tmp, ignore_errors=True)
              print("\nSelesai: %d berhasil, %d gagal, total %.1f MB di '%s'" % (ok, fail, total / 1e6, out_root))
              print("Salin folder '%s' ke folder game di handheld (di samping beanloader)." % out_root)
              return 0 if fail == 0 else 1


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
          EOF_PY1
          echo "--stage 3 --timeout 90 --maxtime 300 --shots 300" > out/bean_dreams/loader.args
          echo "Taruh libKumoGame.so (dari lib/arm64-v8a di APK Bean Dreams) ke folder ini. Taruh juga APK-nya di folder game (satu level di atas folder ini), namanya bebas asal berakhiran .apk. Untuk suara: jalankan convert_audio.py di PC lalu salin folder audio/ ke folder game. Jangan di-upload ke GitHub." > out/bean_dreams/libs/TARUH-LIB-DI-SINI.txt

      - name: Kompilasi (aarch64)
        run: |
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -o out/bean_dreams/elfprobe64 src/elfprobe64.c -ldl
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -Wno-format-truncation -o out/bean_dreams/beanloader src/beanloader.c -ldl -lm -lpthread
          file out/bean_dreams/elfprobe64 out/bean_dreams/beanloader || true
          for B in elfprobe64 beanloader; do
            echo "--- $B: library yang dibutuhkan:"
            aarch64-linux-gnu-readelf -d out/bean_dreams/$B | grep NEEDED
            MAXV=$(aarch64-linux-gnu-readelf -V out/bean_dreams/$B | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
            echo "$B butuh GLIBC tertinggi: $MAXV (device: 2.37 atau lebih baru)"
            if [ "$(printf '%s\n%s\n' 2.37 "$MAXV" | sort -V | tail -1)" != "2.37" ]; then
              echo "GAGAL: $B butuh glibc lebih baru dari 2.37. Simbol penyebab:"
              aarch64-linux-gnu-nm -D --undefined-only out/bean_dreams/$B | grep -E 'GLIBC_2\.(3[89]|[4-9][0-9])'
              exit 1
            fi
          done

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: bean-arm64
          path: out
