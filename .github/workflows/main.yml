          static void (*rh_lookup(const char *n))(const jv *, jv *) {
            static const char *emptystr[] = { "adsGetSystemName", "iapGetName", "iapGetDescription", "iapGetPrice", "iapGetError", NULL };
            static const char *noop_pfx[] = { "ads", "analytics", "brag", "cloud", "notification", "score", "iap", "show", "setM", "setS", "stopM", "stopS", "unload",
              "getS", "getM", "isA", "isP", "canO", "promptOpen", NULL };
            int i;
            for (i = 0; rh_tab[i].name; i++) if (!strcmp(rh_tab[i].name, n)) return rh_tab[i].fn;
            for (i = 0; emptystr[i]; i++) if (!strcmp(emptystr[i], n)) return rh_emptystr;
            for (i = 0; noop_pfx[i]; i++) if (!strncmp(n, noop_pfx[i], strlen(noop_pfx[i]))) return rh_noop;
            return NULL;
          }
          static void *mk_method(const char *cls, const char *name, const char *sig, int is_static) {
            int i;
            MInfo *m;
            pthread_mutex_lock(&g_hmu);
            for (i = 0; i < g_nmi; i++) if (!strcmp(g_mi[i].name, name) && !strcmp(g_mi[i].sig, sig) && !strcmp(g_mi[i].cls, cls)) { pthread_mutex_unlock(&g_hmu); return &g_mi[i]; }
            if (g_nmi >= 320) { pthread_mutex_unlock(&g_hmu); L("[JNI] tabel methodID penuh!\n"); return NULL; }
            m = &g_mi[g_nmi];
            snprintf(m->name, sizeof m->name, "%s", name); snprintf(m->sig, sizeof m->sig, "%s", sig); snprintf(m->cls, sizeof m->cls, "%s", cls);
            m->is_static = is_static; m->fn = rh_lookup(name); sig_parse(m);
            g_nmi++;
            pthread_mutex_unlock(&g_hmu);
            if (g_nmi <= 120) L("[JNI] methodID baru: %s.%s %s%s\n", cls, name, sig, m->fn ? "" : "  (belum ada handler)");
            return m;
          }
          static void mi_dispatch(const void *mid, const jv *a, jv *r) {
