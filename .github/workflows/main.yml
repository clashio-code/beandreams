            const Elf64_Ehdr *eh;
            const Elf64_Phdr *ph;
            uint64_t minv = ~0ULL, maxv = 0;
            size_t align = 0x4000;
            void *raw;
            int i, dyn_found = 0;
            if (nmods >= MAXMOD) return -1;
            m = &mods[nmods];
            memset(m, 0, sizeof *m);
            snprintf(m->name, sizeof m->name, "%s", name);
            snprintf(path, sizeof path, "%s/%s", dir, name);
            if (read_file(path, &m->file, &m->fsize) != 0) { L("GAGAL membaca %s\n", path); return -1; }
            eh = (const Elf64_Ehdr *)m->file;
            if (m->fsize < sizeof *eh || memcmp(eh->e_ident, ELFMAG, SELFMAG) || eh->e_ident[EI_CLASS] != ELFCLASS64 || eh->e_machine != EM_AARCH64 || eh->e_type != ET_DYN) {
              L("%s: bukan ELF AArch64 shared object\n", name); return -1;
            }
            ph = (const Elf64_Phdr *)(m->file + eh->e_phoff);
            for (i = 0; i < eh->e_phnum; i++) if (ph[i].p_type == PT_LOAD) {
              if (ph[i].p_vaddr < minv) minv = ph[i].p_vaddr;
              if (ph[i].p_vaddr + ph[i].p_memsz > maxv) maxv = ph[i].p_vaddr + ph[i].p_memsz;
              if (ph[i].p_align > align) align = (size_t)ph[i].p_align;
            }
            minv &= ~(uint64_t)(PAGE - 1); maxv = (maxv + PAGE - 1) & ~(uint64_t)(PAGE - 1);
            m->span = (size_t)(maxv - minv);
            raw = mmap(NULL, m->span + align, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
            if (raw == MAP_FAILED) { L("%s: mmap gagal\n", name); return -1; }
            m->base = (uint8_t *)(((uintptr_t)raw + align - 1) & ~(uintptr_t)(align - 1));
            m->bias = (uintptr_t)m->base - (uintptr_t)minv;
            for (i = 0; i < eh->e_phnum; i++) if (ph[i].p_type == PT_LOAD) {
              if ((size_t)ph[i].p_offset + ph[i].p_filesz > m->fsize) { L("%s: segmen melewati ujung file\n", name); return -1; }
              memcpy((void *)(m->bias + ph[i].p_vaddr), m->file + ph[i].p_offset, ph[i].p_filesz);
            }
            for (i = 0; i < eh->e_phnum; i++) {
              if (ph[i].p_type == PT_TLS) { L("%s: punya PT_TLS (belum didukung)\n", name); return -1; }
              if (ph[i].p_type == PT_DYNAMIC) {
                const Elf64_Dyn *d = (const Elf64_Dyn *)(m->bias + ph[i].p_vaddr);
                dyn_found = 1;
                for (; d->d_tag != DT_NULL; d++) {
                  switch (d->d_tag) {
                    case DT_SYMTAB: m->sym = (Elf64_Sym *)(m->bias + d->d_un.d_ptr); break;
                    case DT_STRTAB: m->str = (const char *)(m->bias + d->d_un.d_ptr); break;
                    case DT_RELA: m->rela = (Elf64_Rela *)(m->bias + d->d_un.d_ptr); break;
                    case DT_RELASZ: m->nrela = (uint32_t)(d->d_un.d_val / sizeof(Elf64_Rela)); break;
                    case DT_JMPREL: m->jrela = (Elf64_Rela *)(m->bias + d->d_un.d_ptr); break;
                    case DT_PLTRELSZ: m->njrela = (uint32_t)(d->d_un.d_val / sizeof(Elf64_Rela)); break;
                    case DT_INIT: m->init = d->d_un.d_val; break;
                    case DT_INIT_ARRAY: m->iarr = (uint64_t *)(m->bias + d->d_un.d_ptr); break;
                    case DT_INIT_ARRAYSZ: m->niarr = (uint32_t)(d->d_un.d_val / 8); break;
                    case DT_REL: case 36 /* DT_RELR */: case 0x6000000f: case 0x60000011: case DT_TEXTREL:
                      L("%s: tipe relokasi tidak didukung (tag 0x%x)\n", name, (unsigned)d->d_tag); return -1;
                    default: break;
                  }
                }
              }
            }
            if (!dyn_found || !m->sym || !m->str) { L("%s: section dinamis tidak lengkap\n", name); return -1; }
            if (eh->e_shoff && (size_t)eh->e_shoff + (size_t)eh->e_shnum * sizeof(Elf64_Shdr) <= m->fsize) {
              const Elf64_Shdr *sh = (const Elf64_Shdr *)(m->file + eh->e_shoff);
              for (i = 0; i < eh->e_shnum; i++) if (sh[i].sh_type == SHT_DYNSYM) m->nsym = (int)(sh[i].sh_size / sizeof(Elf64_Sym));
            }
            if (m->nsym <= 0) { L("%s: jumlah simbol tidak diketahui\n", name); return -1; }
            m->rval = calloc((size_t)m->nsym, sizeof(uint64_t));
            m->rhave = calloc((size_t)m->nsym, 1);
            nmods++;
            *out = m;
            L("[load] %s: base=%p span=0x%zx bias=0x%lx simbol=%d rela=%u jmprel=%u init_array=%u\n", name, (void *)m->base, m->span, (unsigned long)m->bias, m->nsym, m->nrela, m->njrela, m->niarr);
            return 0;
          }

          static void *mod_find(const Mod *m, const char *name) {
            int i;
            for (i = 1; i < m->nsym; i++) {
              const Elf64_Sym *s = &m->sym[i];
              if (s->st_shndx != SHN_UNDEF && s->st_name && ELF64_ST_BIND(s->st_info) != STB_LOCAL && strcmp(m->str + s->st_name, name) == 0) return (void *)(m->bias + s->st_value);
            }
            return NULL;
          }

          static uint64_t resolve_uncached(Mod *self, const Elf64_Sym *s) {
            const char *n = self->str + s->st_name;
            int i;
            void *p;
            if (s->st_shndx != SHN_UNDEF) { cnt_self++; return s->st_shndx == SHN_ABS ? s->st_value : (uint64_t)(self->bias + s->st_value); }
            for (i = 0; i < nmods; i++) if (&mods[i] != self && (p = mod_find(&mods[i], n))) { cnt_mod++; return (uint64_t)(uintptr_t)p; }
            for (i = 0; shim[i].name; i++) if (strcmp(shim[i].name, n) == 0) { cnt_shim++; shim_hit[i] = 1; return (uint64_t)(uintptr_t)shim[i].addr; }
            if ((p = dlsym(RTLD_DEFAULT, n))) { cnt_libc++; return (uint64_t)(uintptr_t)p; }
            if (h_gles && (p = dlsym(h_gles, n))) { cnt_gl++; return (uint64_t)(uintptr_t)p; }
            if (h_egl && (p = dlsym(h_egl, n))) { cnt_gl++; return (uint64_t)(uintptr_t)p; }
            if (ELF64_ST_BIND(s->st_info) == STB_WEAK) { cnt_weak0++; return 0; }
            for (i = 0; i < nunres; i++) if (strcmp(unres_name[i], n) == 0) return (uint64_t)(uintptr_t)tstubs[i];
            cnt_unres++;
            if (nunres < MAXUNRES) { unres_name[nunres] = n; return (uint64_t)(uintptr_t)tstubs[nunres++]; }
            return (uint64_t)(uintptr_t)tstubs[MAXUNRES - 1];
          }
          static uint64_t resolve(Mod *self, uint32_t si) {
            if (si == 0) return 0;
            if (!self->rhave[si]) { self->rval[si] = resolve_uncached(self, &self->sym[si]); self->rhave[si] = 1; }
            return self->rval[si];
          }

          static int relocate(Mod *m) {
            int pass, bad = 0;
            unsigned ntype[2048] = {0};
            for (pass = 0; pass < 2; pass++) {
              Elf64_Rela *r = pass ? m->jrela : m->rela;
              uint32_t n = pass ? m->njrela : m->nrela, k;
              for (k = 0; k < n; k++) {
                uint32_t type = (uint32_t)ELF64_R_TYPE(r[k].r_info), si = (uint32_t)ELF64_R_SYM(r[k].r_info);
                uint64_t *where = (uint64_t *)(m->bias + r[k].r_offset);
                if (type < 2048) ntype[type]++;
                switch (type) {
                  case 0: break;                                                     /* R_AARCH64_NONE */
                  case 1027: *where = (uint64_t)m->bias + (uint64_t)r[k].r_addend; break;   /* RELATIVE */
                  case 257: *where = resolve(m, si) + (uint64_t)r[k].r_addend; break;       /* ABS64 */
                  case 1025: case 1026: *where = resolve(m, si) + (uint64_t)r[k].r_addend; break;  /* GLOB_DAT, JUMP_SLOT */
                  default: L("[reloc] %s: tipe tidak didukung %u (offset 0x%llx)\n", m->name, type, (unsigned long long)r[k].r_offset); bad++; break;
                }
              }
            }
            L("[reloc] %s: RELATIVE=%u ABS64=%u GLOB_DAT=%u JUMP_SLOT=%u tak-didukung=%d\n", m->name, ntype[1027], ntype[257], ntype[1025], ntype[1026], bad);
            return bad;
          }

          static void protect(Mod *m) {
            const Elf64_Ehdr *eh = (const Elf64_Ehdr *)m->file;
            const Elf64_Phdr *ph = (const Elf64_Phdr *)(m->file + eh->e_phoff);
            size_t np = m->span / PAGE, p;
            unsigned char *fl = calloc(np, 1);
            int i;
            __builtin___clear_cache((char *)m->base, (char *)m->base + m->span);
            for (i = 0; i < eh->e_phnum; i++) if (ph[i].p_type == PT_LOAD) {
              uintptr_t a = (m->bias + ph[i].p_vaddr) & ~(uintptr_t)(PAGE - 1);
              uintptr_t e = (m->bias + ph[i].p_vaddr + ph[i].p_memsz + PAGE - 1) & ~(uintptr_t)(PAGE - 1);
              unsigned pr = ((ph[i].p_flags & PF_R) ? PROT_READ : 0) | ((ph[i].p_flags & PF_W) ? PROT_WRITE : 0) | ((ph[i].p_flags & PF_X) ? PROT_EXEC : 0);
              for (; a < e; a += PAGE) fl[(a - (uintptr_t)m->base) / PAGE] |= (unsigned char)pr;
            }
            for (p = 0; p < np; ) {
              size_t q = p + 1;
              while (q < np && fl[q] == fl[p]) q++;
              if (fl[p] && mprotect(m->base + p * PAGE, (q - p) * PAGE, fl[p]) != 0) L("[protect] %s: mprotect gagal: %s\n", m->name, strerror(errno));
              p = q;
            }
            free(fl);
          }

          extern char **environ;
          static long long now_ns(void) { struct timespec t; clock_gettime(CLOCK_MONOTONIC, &t); return (long long)t.tv_sec * 1000000000LL + t.tv_nsec; }
          static void run_init(Mod *m) {
            uint32_t i;
            long long t0 = now_ns();
            if (m->init) { L("[init] %s: DT_INIT di 0x%llx\n", m->name, (unsigned long long)m->init); ((void (*)(void))(m->bias + m->init))(); }
            for (i = 0; i < m->niarr; i++) {
              uint64_t f = m->iarr[i];
              if (f == 0 || f == ~0ULL) continue;
              g_cur_init = (int)i;
              if (i % 20 == 0 || i + 1 == m->niarr) L("[init] %s: init_array[%u/%u] = +0x%llx\n", m->name, i, m->niarr, (unsigned long long)(f - m->bias));
              ((void (*)(int, char **, char **))(uintptr_t)f)(0, NULL, environ);
            }
            g_cur_init = -1;
            L("[init] %s: selesai (%u konstruktor, %.1f ms)\n", m->name, m->niarr, (double)(now_ns() - t0) / 1e6);
          }

          static int pint(const char *s) { int v = 0; while (*s >= '0' && *s <= '9') v = v * 10 + (*s++ - '0'); return v; }

          /* titik masuk JNI yang akan dipanggil loader di stage berikutnya (nama persis dari classes.dex, class NativeInterface) */
          static const char *const jni_names[] = { "NativeInit", "NativeActivate", "NativeDeactivate", "NativeResized", "NativeRender", "NativeBeginAtomic", "NativeEndAtomic",
            "NativeKeyDownUp", "NativePointerDown", "NativePointerMove", "NativePointerUp", "NativePointerCancel", "NativeBundlePathChanged", "NativeContextLost",
            "NativeAccelerationEvent", "NativeDownloadData", "NativeDownloadSuccess", "NativeDownloadFailure", "NativePushAdReward", "NativePushCloudValues",
            "NativeIapComplete", "NativeScoresSubmitted", NULL };
          static int jni_check(Mod *m) {
            int i, found = 0, total = 0;
            char full[160];
            L("\n== titik masuk JNI (Java_com_kumobius_android_NativeInterface_*) ==\n");
            for (i = 0; jni_names[i]; i++) {
              void *f;
              snprintf(full, sizeof full, "Java_com_kumobius_android_NativeInterface_%s", jni_names[i]);
              f = mod_find(m, full);
              total++;
              if (f) { found++; L("  %-26s +0x%llx\n", jni_names[i], (unsigned long long)((uintptr_t)f - m->bias)); }
              else L("  %-26s TIDAK ADA\n", jni_names[i]);
            }
            L("ditemukan %d dari %d | JNI_OnLoad: %s\n", found, total, mod_find(m, "JNI_OnLoad") ? "ada" : "tidak ada (memang tidak dipakai game ini)");
            return found == total ? 0 : 1;
          }

          /* ======================= log akses file (engine membaca aset dari APK sendiri; ini untuk membuktikannya) ======================= */
          static int fs_n, fs_fail;
          static void fs_note(const char *op, const char *p, int ok) {
            if (ok ? (fs_n++ < 60) : (fs_fail++ < 150)) L("[fs] %s(\"%s\") -> %s\n", op, p ? p : "NULL", ok ? "ok" : "GAGAL");
          }
          static FILE *b_fopen(const char *p, const char *m) { FILE *f = fopen(p, m); fs_note("fopen", p, f != NULL); return f; }
          static int b_open(const char *p, int fl, ...) {
            int mode = 0, r;
            if (fl & O_CREAT) { va_list ap; va_start(ap, fl); mode = va_arg(ap, int); va_end(ap); }
            r = open(p, fl, mode);
            fs_note("open", p, r >= 0);
            return r;
          }
          static int b_stat(const char *p, struct stat *st) { int r = stat(p, st); fs_note("stat", p, r == 0); return r; }
          static int b_access(const char *p, int m) { int r = access(p, m); fs_note("access", p, r == 0); return r; }
          static DIR *b_opendir(const char *p) { DIR *d = opendir(p); fs_note("opendir", p, d != NULL); return d; }

          /* ======================= emulasi JNI: JNIEnv / JavaVM palsu + objek INativeResponder ======================= */
          typedef union { uint8_t z; int32_t i; int64_t j; float f; double d; void *l; } jv;

          enum { K_STR = 1, K_CLS, K_OBJ, K_ARR, K_BUF };
          typedef struct H {
            uint32_t magic; int kind, global;
            pthread_t owner; struct H *next;
            char *s;                 /* K_STR: isi UTF-8; K_CLS/K_OBJ: nama kelas */
            void *data; int len, esz;   /* K_ARR (elemen esz byte) / K_BUF (len = kapasitas) */
          } H;
          #define HMAGIC 0xBEA70001u
          static H *g_hlist;
          static void *g_resp, *g_ni_cls;   /* objek INativeResponder palsu + kelas NativeInterface (permanen) */
          static pthread_mutex_t g_hmu = PTHREAD_MUTEX_INITIALIZER;
          static pthread_t g_main_thread;

          static H *hnew(int kind) {
            H *h = calloc(1, sizeof *h);
            if (!h) return NULL;
            h->magic = HMAGIC; h->kind = kind; h->owner = pthread_self();
            pthread_mutex_lock(&g_hmu); h->next = g_hlist; g_hlist = h; pthread_mutex_unlock(&g_hmu);
            return h;
          }
          static H *hget(const void *p) { const H *h = (const H *)p; return ((uintptr_t)p > 4096 && h->magic == HMAGIC) ? (H *)h : NULL; }
          static void *mk_str(const char *s) { H *h = hnew(K_STR); if (!h) return NULL; h->s = strdup(s ? s : ""); return h; }
          static const char *h2s(const void *p) { H *h = hget(p); return (h && h->s) ? h->s : ""; }
          static void *mk_cls(const char *name) {
            static H *cls[96]; static int n;
            int i;
            pthread_mutex_lock(&g_hmu);
            for (i = 0; i < n; i++) if (!strcmp(cls[i]->s, name)) { pthread_mutex_unlock(&g_hmu); return cls[i]; }
            pthread_mutex_unlock(&g_hmu);
            { H *h = hnew(K_CLS); if (!h) return NULL; h->s = strdup(name); h->global = 1;
              pthread_mutex_lock(&g_hmu); if (n < 96) cls[n++] = h; pthread_mutex_unlock(&g_hmu); return h; }
          }
          static void *mk_obj(const char *cls) { H *h = hnew(K_OBJ); if (!h) return NULL; h->s = strdup(cls); return h; }
          static void *mk_arr(int esz, int len) { H *h = hnew(K_ARR); if (!h) return NULL; h->esz = esz; h->len = len; h->data = calloc((size_t)(len > 0 ? len : 1), (size_t)esz); return h; }
          /* bebaskan semua referensi lokal yang dibuat thread utama (dipanggil setelah tiap panggilan native); global & kelas dipertahankan */
          static void local_reset(void) {
            H **pp, *h;
            pthread_mutex_lock(&g_hmu);
            pp = &g_hlist;
            while ((h = *pp) != NULL) {
              if (!h->global && pthread_equal(h->owner, g_main_thread)) { *pp = h->next; free(h->s); free(h->data); free(h); }
              else pp = &h->next;
            }
            pthread_mutex_unlock(&g_hmu);
          }

          /* ---- methodID: nama + tanda tangan -> handler C ---- */
          typedef struct MInfo { char name[56]; char sig[200]; char cls[72]; int is_static, nargs; char at[16]; char rt; void (*fn)(const jv *, jv *); int ncalls; } MInfo;
          static MInfo g_mi[320];
          static int g_nmi;
          static MInfo *mi_get(const void *mid) { const MInfo *m = (const MInfo *)mid; return (m >= g_mi && m < g_mi + g_nmi) ? (MInfo *)m : NULL; }

          static void sig_parse(MInfo *m) {
            const char *p = m->sig;
            m->nargs = 0; m->rt = 'V';
            if (*p != '(') return;
            for (p++; *p && *p != ')'; ) {
              char c = *p;
              if (m->nargs < 15) m->at[m->nargs] = (c == '[' || c == 'L') ? 'L' : c;
              m->nargs++;
              if (c == '[') { while (*p == '[') p++; if (*p == 'L') { while (*p && *p != ';') p++; } p++; }
              else if (c == 'L') { while (*p && *p != ';') p++; p++; }
              else p++;
            }
            if (m->nargs > 15) m->nargs = 15;
            if (*p == ')') { p++; m->rt = (*p == '[' || *p == 'L') ? 'L' : *p; }
          }
          static void collect_va(const MInfo *m, va_list ap, jv *a) {
            int i;
            for (i = 0; i < m->nargs; i++) switch (m->at[i]) {
              case 'J': a[i].j = va_arg(ap, int64_t); break;
              case 'F': a[i].f = (float)va_arg(ap, double); break;
              case 'D': a[i].d = va_arg(ap, double); break;
              case 'L': a[i].l = va_arg(ap, void *); break;
              default: a[i].i = va_arg(ap, int); break;
            }
          }
          static void fmt_args(const MInfo *m, const jv *a, char *buf, size_t n) {
            int i; size_t o = 0;
            buf[0] = 0;
            for (i = 0; i < m->nargs && o + 8 < n; i++) {
              int w = 0;
              switch (m->at[i]) {
                case 'J': w = snprintf(buf + o, n - o, "%s%lld", i ? ", " : "", (long long)a[i].j); break;
                case 'F': w = snprintf(buf + o, n - o, "%s%.3f", i ? ", " : "", (double)a[i].f); break;
                case 'D': w = snprintf(buf + o, n - o, "%s%.3f", i ? ", " : "", a[i].d); break;
                case 'L': { H *h = hget(a[i].l); w = snprintf(buf + o, n - o, h && h->kind == K_STR ? "%s\"%.60s\"" : "%s%s", i ? ", " : "", h && h->kind == K_STR ? h->s : (a[i].l ? "<obj>" : "null")); break; }
                default: w = snprintf(buf + o, n - o, "%s%d", i ? ", " : "", a[i].i); break;
              }
              if (w < 0) break;
              o += (size_t)w;
            }
          }

          /* ---- audio (diimplementasi di bagian audio, setelah inisialisasi SDL) ---- */
          static void au_load_sound(const char *name, const char *apkpath);
          static void au_unload_sound(const char *name);
          static void au_play_sound(int64_t id, const char *name, float vol, float pitch, int loop);
          static void au_stop_sound(int64_t id);
          static void au_set_sound_vol(int64_t id, float v);
          static void au_set_sound_pitch(int64_t id, float p);
          static void au_play_music(const char *path, int enabled, int loopcount);
          static void au_stop_music(void);
          static void au_set_music_vol(float v);
          static void au_set_music_enabled(int e);
          static void au_play_voice(const char *path);

          /* ---- handler method INativeResponder (Java -> C). Hasil default 0/false/null; method tak dikenal dicatat. ---- */
          static int64_t g_snd_id = 100, g_prompt_id = 1000;
          static volatile int g_quit;
          static int64_t g_dl_q[16];
          static int g_dl_n;
          #define RH(n) static void rh_##n(const jv *a, jv *r)
          static const char *astr(const jv *a, int i) { H *h = hget(a[i].l); return (h && h->kind == K_STR && h->s) ? h->s : "(null)"; }
          RH(noop) { (void)a; (void)r; }
          RH(emptystr) { (void)a; r->l = mk_str(""); }
          RH(playSound) { static int n; r->j = ++g_snd_id; au_play_sound(r->j, astr(a, 0), a[1].f, a[2].f, a[3].i); if (n++ < 30) L("[audio] playSound(\"%s\", vol=%.2f, pitch=%.2f, loop=%d) -> id %lld\n", astr(a, 0), (double)a[1].f, (double)a[2].f, a[3].i, (long long)r->j); }
          RH(loadSound) { static int n; (void)r; au_load_sound(astr(a, 0), astr(a, 1)); if (n++ < 4) L("[audio] loadSound(\"%s\", \"%s\")\n", astr(a, 0), astr(a, 1)); }
          RH(playMusic) { static int n; (void)r; if (n++ < 20) L("[audio] playMusic(\"%s\", enabled=%d, loop=%d)\n", astr(a, 0), a[1].i, a[2].i); au_play_music(astr(a, 0), a[1].i, a[2].i); }
          RH(playVoice) { static int n; (void)r; if (n++ < 12) L("[audio] playVoice(\"%s\")\n", astr(a, 0)); au_play_voice(astr(a, 0)); }
          RH(unloadSound) { (void)r; au_unload_sound(astr(a, 0)); }
          RH(stopSound) { (void)r; au_stop_sound(a[0].j); }
          RH(setSoundVolume) { (void)r; au_set_sound_vol(a[0].j, a[1].f); }
